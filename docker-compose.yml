version: '3.8'
services:
  app:
    image: calcom/cal.com:latest
    restart: unless-stopped
    ports:
      - "8080:8000"
    environment:
      - BRAND_NAME=ASTERIA SKIN & DENTAL
      - PRIMARY_COLOR=#0D9488
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=bmad
      - POSTGRES_PASSWORD=bmad_secret
      - POSTGRES_DB=tpl_serp_clinic_salon_crm
